<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie - FreeFlix</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar scrolled">
        <div class="nav-left">
            <a href="index.html" class="logo">FreeFlix</a>
        </div>
    </nav>

    <div class="movie-page">
        <div class="movie-hero">
            <img class="movie-backdrop" src="" alt="" id="movie-backdrop">
            <div class="movie-hero-content">
                <img class="movie-poster" src="" alt="" id="movie-poster">
                <div class="movie-info">
                    <h1 class="movie-title" id="movie-title">Loading...</h1>
                    <div class="movie-meta">
                        <span class="movie-rating" id="movie-rating"><i class="fas fa-star"></i> --</span>
                        <span class="movie-year" id="movie-year">----</span>
                        <span class="movie-duration" id="movie-duration">-- min</span>
                    </div>
                    <p class="movie-overview" id="movie-overview">Loading description...</p>
                    <div class="movie-genres" id="movie-genres"></div>
                    <button class="btn-play" onclick="playMovie()">
                        <i class="fas fa-play"></i> Watch Now
                    </button>
                </div>
            </div>
        </div>

        <div class="video-player" id="player" style="display: none;">
            <div class="player-wrapper">
                <iframe id="video-iframe" src="" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
